name: Release

# Builds installers for a pushed version tag and creates a DRAFT GitHub Release.
# A maintainer reviews and publishes the draft by hand. See docs/releasing/RELEASING.md.
# Running it manually (workflow_dispatch) is a dry run: installers are built and kept as
# workflow artifacts, and no release is created.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Tag matches versions and changelog
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          # A dry run checks the version currently in package.json.
          if [ -z "$TAG" ]; then TAG="v$(node -p 'require("./package.json").version')"; fi
          node scripts/check-version.mjs "$TAG"

  ci:
    name: CI
    needs: validate
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.name }})
    needs: [validate, ci]
    # Signing secrets live in the protected `release` environment and are never
    # available to pull-request workflows. Dry runs build unsigned, outside it.
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ""
          - name: macos
            os: macos-latest
            args: --target universal-apple-darwin
          - name: linux
            os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    env:
      REQUIRE_SIGNING: ${{ vars.REQUIRE_SIGNING }}
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enforce the signing policy
        shell: bash
        run: |
          if [ "$REQUIRE_SIGNING" = "true" ]; then
            if [ "$RUNNER_OS" = "Windows" ] && [ "$HAS_WINDOWS_CERT" != "true" ]; then
              echo "::error::REQUIRE_SIGNING is true but WINDOWS_CERTIFICATE is not configured"; exit 1
            fi
            if [ "$RUNNER_OS" = "macOS" ] && [ "$HAS_APPLE_CERT" != "true" ]; then
              echo "::error::REQUIRE_SIGNING is true but APPLE_CERTIFICATE is not configured"; exit 1
            fi
          fi
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf
      # No dependency caches here: release builds start clean to avoid cache poisoning.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - name: Install the pinned Rust toolchain
        shell: bash
        working-directory: src-tauri
        run: |
          rustup toolchain install
          if [ "$RUNNER_OS" = "macOS" ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi
      - name: Fetch and verify the speech model
        run: node scripts/fetch-model.mjs
      - name: Generate the third-party license inventory
        shell: bash
        run: |
          mkdir -p public
          node scripts/license-inventory.mjs public/third-party-licenses.txt
      - name: Import the Windows signing certificate
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $config = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = "sha256"
            timestampUrl = "http://timestamp.digicert.com"
          } } } | ConvertTo-Json -Depth 5
          $file = Join-Path $env:RUNNER_TEMP "signing.json"
          Set-Content -Path $file -Value $config
          "SIGNING_CONFIG=$file" >> $env:GITHUB_ENV
      - name: Build installers
        shell: bash
        env:
          ARGS: ${{ matrix.args }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # The Tauri bundler signs/notarizes whenever these variables exist, so drop empty ones.
          [ -n "$APPLE_CERTIFICATE" ] || unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
          [ -n "$APPLE_ID" ] || unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          extra=()
          if [ -n "${SIGNING_CONFIG:-}" ]; then extra=(--config "$SIGNING_CONFIG"); fi
          # shellcheck disable=SC2086 # ARGS is intentionally word-split
          npm run tauri -- build $ARGS "${extra[@]}" -- --locked
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist-release
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} dist-release/ \;
          if [ "$RUNNER_OS" = "Linux" ]; then cp public/third-party-licenses.txt dist-release/THIRD_PARTY_LICENSES.txt; fi
          ls -l dist-release
          [ -n "$(ls -A dist-release)" ] || { echo "::error::No installers were produced"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seeread-${{ matrix.name }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Create draft release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: seeread-*
          path: dist-release
          merge-multiple: true
      - name: Checksums
        working-directory: dist-release
        run: |
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-release/*
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          REQUIRE_SIGNING: ${{ vars.REQUIRE_SIGNING }}
        run: |
          {
            node scripts/extract-changelog.mjs "$TAG"
            echo
            echo "### Verifying downloads"
            echo
            echo "Check a file against \`SHA256SUMS\`, or verify its build provenance:"
            echo
            echo '```sh'
            echo "gh attestation verify <file> --repo $REPO"
            echo '```'
            if [ "$REQUIRE_SIGNING" != "true" ]; then
              echo
              echo "> **Note:** these builds are not code-signed. Windows SmartScreen and macOS Gatekeeper will warn on first launch."
            fi
          } > notes.md
          cat notes.md
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" dist-release/* --repo "$REPO" --draft --verify-tag \
            --title "SeeRead ${TAG#v}" --notes-file notes.md "${prerelease[@]}"
