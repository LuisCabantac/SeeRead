[package]
name = "seeread"
version = "0.1.0"
description = "Cross-platform, privacy-conscious desktop teleprompter with local voice tracking"
authors = ["SeeRead contributors"]
license = "Apache-2.0"
repository = "https://github.com/clintgalendez/SeeRead"
edition = "2024"
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "seeread_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-clipboard-manager = "2.4.2"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-opener = "2.7.1"
tauri-plugin-store = "2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18.2"
sherpa-onnx = "1.13.8"
tauri-plugin-log = "2.10.1"
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
