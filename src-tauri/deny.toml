# cargo-deny policy: run with `cargo deny check` from src-tauri/.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
# RustSec advisories fail the build; unmaintained crates deep in the GTK/WebKit stack
# (Linux) are reported as warnings for transitive dependencies only.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses compatible with distributing SeeRead under Apache-2.0.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "BSL-1.0",
  "Unlicense",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  # File-level copyleft only; used unmodified by transitive dependencies.
  "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
